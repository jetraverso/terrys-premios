<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terry's · Premios (local)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141311">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f1ede5'/%3E%3Ctext x='50' y='76' font-family='Impact,sans-serif' font-size='72' text-anchor='middle' fill='%23141311'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --paper:#141311; --surface:#1d1b18; --surface-2:#26231f; --ink:#f1ede5; --ink-2:#c9c3b7; --muted:#8f887b; --line:#332f29; --line-2:#453f37;
  --out:#e0693f; --out-soft:#40221a; --out-ink:#f4b9a1;
  --accent:#5c9fc4; --accent-soft:#1b2f3b;
  --ok:#5cb47f; --ok-soft:#1c3326; --warn:#e29a4a; --warn-soft:#3a3010; --danger:#e5665e; --gold:#f2c14e;
  --display:"Bebas Neue","Impact","Arial Narrow",sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--out-ink)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-size:30px;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:10px}
.wordmark small{font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.me{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center}
.lnk{background:none;border:0;color:var(--out-ink);text-decoration:underline;cursor:pointer;font-size:13px}
.btn{padding:11px 16px;border-radius:10px;border:0;background:var(--out);color:#1a0f09;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);font-weight:600}
.btn.ok{background:var(--ok);color:#0d1a12}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=url]{padding:11px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--paper);width:100%}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--out);outline-offset:1px}

/* Login */
.login{max-width:360px;margin:12vh auto 0;padding:26px 22px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.login h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.login p{color:var(--ink-2);margin:6px 0 16px}
.login label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 5px;font-weight:600}
.login .btn{width:100%;margin-top:18px}
.msg{margin-top:12px;font-size:14px;color:var(--danger);min-height:1em}

/* Canje */
.canje{margin-top:18px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.canje h2,.panel h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em;line-height:1.1}
.canje .cf{display:flex;gap:8px;margin-top:10px}
.canje input{font-family:var(--display);font-size:30px;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px}
.canje input::placeholder{letter-spacing:.08em;opacity:.35}
.res{margin-top:14px}
.tk{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:14px 16px;border-radius:12px;border:2px solid var(--line-2);background:var(--paper)}
.tk.valido{border-color:var(--ok)}
.tk.usado{border-color:var(--line-2);opacity:.9}
.tk.vencido{border-color:var(--warn)}
.tk .st{grid-column:1/-1;font-family:var(--display);font-size:28px;letter-spacing:.04em;line-height:1}
.tk.valido .st{color:var(--ok)} .tk.vencido .st{color:var(--warn)} .tk.usado .st{color:var(--muted)}
.tk .prem{grid-column:1/-1;font-size:20px;font-weight:700;margin-bottom:6px}
.tk dt{color:var(--muted)} .tk dd{font-weight:600}
.tk .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nf{padding:12px 14px;border-radius:12px;background:var(--out-soft);color:var(--out-ink)}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.card{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .v{font-family:var(--display);font-size:34px;line-height:1;margin-top:4px}
.card .s{font-size:12px;color:var(--ink-2);margin-top:2px}

/* Solapas */
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}
.tabs button{padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--out)}
.panel{padding-top:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input[type=search]{max-width:280px}
.bar .n{color:var(--muted);font-size:13px;margin-left:auto}
.bar label{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.si{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--surface-2);color:var(--muted)}
.pill.gan{background:var(--warn-soft);color:var(--gold)} .pill.can{background:var(--accent-soft);color:var(--accent)} .pill.ven{background:var(--out-soft);color:var(--out-ink)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.btn.mini{padding:6px 12px;font-size:13px;border-radius:8px}
.tacho{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer}
.tacho:hover,.tacho:focus-visible{color:var(--danger);border-color:var(--danger);background:var(--out-soft)}
.tacho:disabled{opacity:.4;cursor:default}
td.act{text-align:right}
.tabs{overflow-x:auto}
.tabs button{white-space:nowrap}
.tabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--out);color:#1a0f09;font-size:12px;line-height:18px;text-align:center}
.sub{color:var(--muted);font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* Un bloque por día: el de hoy abierto, los anteriores plegados */
.dias{display:grid;gap:8px}
.dia{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.dia>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;user-select:none}
.dia>summary::-webkit-details-marker{display:none}
.dia>summary::before{content:"";flex:none;width:0;height:0;border:5px solid transparent;border-left:7px solid var(--muted);transition:transform .15s}
.dia[open]>summary::before{transform:rotate(90deg) translateX(2px)}
.dia>summary b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em}
.dia>summary .hoy{background:var(--out);color:#1a0f09;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.dia>summary .r{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.dia[open]>summary{border-bottom:1px solid var(--line)}
.dia .tw{border:0;border-radius:0}
.dia .empty{padding:16px}

/* QR */
.qr{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:700px){.qr{grid-template-columns:1fr}}
.qr label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 5px;font-weight:600}
.qr p{color:var(--ink-2);font-size:14px}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center}
.qrbox svg{width:100%;height:auto;display:block}
.qrurl{font-size:12px;color:var(--muted);word-break:break-all;margin-top:8px}
.demo{position:fixed;left:50%;bottom:0;transform:translateX(-50%);background:var(--out-soft);color:var(--out-ink);font-size:12px;padding:3px 10px;border-radius:8px 8px 0 0;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
// Los mismos dos valores que en index.html. Vacíos = modo demo (lee lo que se jugó en este navegador).
const SUPABASE_URL='https://cgkpklimplpedgxbgzvu.supabase.co';
const SUPABASE_KEY='sb_publishable_yG1hrdoynoxBBYh9LX7QpA_we_bb_qC';

const SB=!!(SUPABASE_URL&&SUPABASE_KEY);
const sbc=SB?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'terrys-premios-local'}}):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoyISO=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'});
const fFecha=d=>d?new Date(d.length===10?d+'T12:00:00':d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Madrid'}):'';
const fHora=d=>d?new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}):'';
const telBonito=t=>{const m=String(t||'').match(/^\+34(\d{3})(\d{3})(\d{3})$/);return m?`${m[1]} ${m[2]} ${m[3]}`:t};
const normCodigo=c=>{const x=String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(/^[A-Z0-9]{5}$/.test(x))return'T-'+x;if(/^T[A-Z0-9]{5}$/.test(x))return'T-'+x.slice(1);return null};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
if(!SB)document.body.insertAdjacentHTML('beforeend','<div class="demo">Modo demo · datos de este navegador</div>');

// ---------- Datos ----------
const demoDb=()=>{try{return JSON.parse(localStorage.getItem('tp_demo_db'))||{jugadores:{},jugadas:[]}}catch{return{jugadores:{},jugadas:[]}}};
const demoSave=db=>{try{localStorage.setItem('tp_demo_db',JSON.stringify(db))}catch{}};
let email='', J=[], P=[], tab='pendientes';

async function cargar(){
  if(!SB){const db=demoDb();J=Object.values(db.jugadores);P=db.jugadas.map(x=>({...x,nombre:(db.jugadores[x.telefono]||{}).nombre}));}
  else{
    const [a,b]=await Promise.all([
      sbc.from('premios_jugadores').select('*').order('ultima_jugada',{ascending:false,nullsFirst:false}).limit(10000),
      sbc.from('premios_jugadas').select('*,premios_jugadores(nombre)').order('creado',{ascending:false}).limit(3000),
    ]);
    if(a.error||b.error){toast('No se pudo cargar: '+(a.error||b.error).message);return}
    J=a.data;P=b.data.map(x=>({...x,nombre:x.premios_jugadores&&x.premios_jugadores.nombre}));
  }
  P.sort((a,b)=>b.creado.localeCompare(a.creado));
  J.sort((a,b)=>String(b.ultima_jugada||'').localeCompare(String(a.ultima_jugada||'')));
  pintarResumen();pintarTab();
}
async function buscarCodigo(cod){
  if(!SB)return P.find(x=>x.codigo===cod)||null;
  const {data,error}=await sbc.from('premios_jugadas').select('*,premios_jugadores(nombre,telefono)').eq('codigo',cod).maybeSingle();
  if(error)throw error;
  return data&&{...data,nombre:data.premios_jugadores&&data.premios_jugadores.nombre};
}
async function canjear(cod){
  if(!SB){
    const db=demoDb(),j=db.jugadas.find(x=>x.codigo===cod);
    if(!j)return{estado:'no_existe'};
    if(j.canjeado)return{estado:'ya_canjeado',canjeado:j.canjeado};
    if(j.vence<hoyISO())return{estado:'vencido'};
    j.canjeado=new Date().toISOString();j.canjeado_por='demo';demoSave(db);return{estado:'ok'};
  }
  const {data,error}=await sbc.rpc('premios_canjear',{p_codigo:cod});
  if(error)throw error;return data;
}
async function borrarJugador(tel){
  if(!SB){
    const db=demoDb();if(!db.jugadores[tel])return{estado:'no_existe'};
    const n=db.jugadas.filter(x=>x.telefono===tel);
    delete db.jugadores[tel];db.jugadas=db.jugadas.filter(x=>x.telefono!==tel);demoSave(db);
    return{estado:'ok',jugadas:n.length,premios:n.filter(x=>x.codigo).length};
  }
  const {data,error}=await sbc.rpc('premios_borrar_jugador',{p_telefono:tel});
  if(error)throw error;return data;
}
async function deshacer(cod){
  if(!SB){const db=demoDb(),j=db.jugadas.find(x=>x.codigo===cod);if(j){j.canjeado=null;j.canjeado_por=null;demoSave(db)}return{estado:'ok'}}
  const {data,error}=await sbc.rpc('premios_deshacer_canje',{p_codigo:cod});
  if(error)throw error;return data;
}

// ---------- Pantallas ----------
function pintarLogin(msg=''){
  $('#app').innerHTML=`<form class="login" id="lf">
    <h1>Terry's · Premios</h1><p>Entrada del local para canjear premios y ver la base.</p>
    <label for="le">Email</label><input type="email" id="le" autocomplete="username" required>
    <label for="lp">Contraseña</label><input type="password" id="lp" autocomplete="current-password" required>
    <button class="btn" id="lb">Entrar</button><div class="msg" id="lm">${esc(msg)}</div></form>`;
  $('#lf').onsubmit=async e=>{
    e.preventDefault();$('#lb').disabled=true;$('#lm').textContent='';
    const {error}=await sbc.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
    if(error){$('#lb').disabled=false;$('#lm').textContent='Email o contraseña incorrectos.';return}
    entrar();
  };
}
async function entrar(){
  if(SB){
    const {data:{session}}=await sbc.auth.getSession();
    if(!session)return pintarLogin();
    const {data:ok}=await sbc.rpc('premios_es_staff');
    if(!ok){await sbc.auth.signOut();return pintarLogin('Ese usuario no está en la lista del local (premios_staff).')}
    email=session.user.email;
  }else email='demo';
  pintarApp();cargar();
}

function pintarApp(){
  $('#app').innerHTML=`<div class="wrap">
    <header><div class="wordmark">TERRY'S <small>Premios · local</small></div>
      <div class="me">${esc(email)} ${SB?'<button class="lnk" id="salir">Salir</button>':''}</div></header>
    <section class="canje">
      <h2>Canjear un premio</h2>
      <div class="cf" id="cf" role="search"><input type="text" id="ci" name="terrys-premio-buscar" placeholder="T-XXXXX" readonly
        autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" inputmode="text" enterkeyhint="search" maxlength="10"
        aria-label="Buscar premio" aria-autocomplete="none" data-form-type="other" data-lpignore="true" data-1p-ignore="true" data-bwignore="true"><button class="btn" type="button" id="cb">Buscar</button></div>
      <div class="res" id="cr"></div>
    </section>
    <div class="cards" id="cards"></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-t="pendientes">Por canjear<span class="cnt" id="cntPend"></span></button>
      <button role="tab" data-t="canjeados">Canjeados</button>
      <button role="tab" data-t="jugadas">Jugadas</button>
      <button role="tab" data-t="jugadores">Jugadores</button>
      <button role="tab" data-t="qr">QR del flyer</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>`;
  if(SB)$('#salir').onclick=async()=>{await sbc.auth.signOut();pintarLogin()};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pintarTab()});
  // No es un <form> ni toma el foco solo: así el navegador y los gestores de contraseñas
  // no ofrecen autocompletar ni abren carteles. Solo se escribe cuando se toca el campo.
  const ci=$('#ci');
  const soltar=()=>ci.removeAttribute('readonly');
  ci.addEventListener('pointerdown',soltar);ci.addEventListener('focus',soltar);
  ci.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verCodigo(ci.value)}});
  $('#cb').onclick=()=>verCodigo(ci.value);
}

async function verCodigo(raw,msg){
  const cod=normCodigo(raw), box=$('#cr');
  if(!cod){box.innerHTML='<div class="nf">El código tiene 5 letras o números, por ejemplo T-K7P3Q.</div>';return}
  $('#ci').value=cod;
  let j;try{j=await buscarCodigo(cod)}catch(err){box.innerHTML=`<div class="nf">No se pudo buscar: ${esc(err.message)}</div>`;return}
  if(!j){box.innerHTML=`<div class="nf">No existe ningún premio con el código <b>${esc(cod)}</b>. Revisá que esté bien escrito.</div>`;return}
  const vencido=!j.canjeado&&j.vence<hoyISO();
  const cls=j.canjeado?'usado':vencido?'vencido':'valido';
  const st=j.canjeado?`Ya canjeado el ${fHora(j.canjeado)}`:vencido?`Vencido el ${fFecha(j.vence)}`:'Válido ✓';
  const recien=j.canjeado&&(Date.now()-new Date(j.canjeado))<12*3600e3;
  box.innerHTML=`<div class="tk ${cls}">
    <div class="st">${esc(msg||st)}</div>
    <div class="prem">${esc(j.premio)}</div>
    <dt>Código</dt><dd class="code">${esc(j.codigo)}</dd>
    <dt>A nombre de</dt><dd>${esc(j.nombre||'')}</dd>
    <dt>Móvil</dt><dd>··· ${esc(String(j.telefono).slice(-3))} <span style="color:var(--muted);font-weight:400">(pedile que te diga los últimos 3)</span></dd>
    <dt>Pedido Glovo</dt><dd>${j.pedido?`<span class="code" style="font-size:16px">#${esc(j.pedido)}</span> · del ${esc(fFecha(j.dia||j.creado))}`:'—'}</dd>
    <dt>Ganado</dt><dd>${esc(fHora(j.creado))}</dd>
    <dt>Vence</dt><dd>${esc(fFecha(j.vence))}</dd>
    ${j.canjeado&&j.canjeado_por?`<dt>Canjeó</dt><dd>${esc(j.canjeado_por)}</dd>`:''}
    <div class="acts">
      ${cls==='valido'?`<button class="btn ok" id="entregar">Entregar y marcar canjeado</button>`:''}
      ${recien?`<button class="btn sec" id="deshacer">Deshacer canje</button>`:''}
      <button class="btn sec" id="limpiar">Otro código</button>
    </div></div>`;
  const limpiar=()=>{box.innerHTML='';$('#ci').value=''};
  $('#limpiar').onclick=limpiar;
  if($('#entregar'))$('#entregar').onclick=async()=>{
    if(!confirm(`¿Entregar "${j.premio}" a ${j.nombre}? Queda marcado como canjeado.`))return;
    $('#entregar').disabled=true;
    let r;try{r=await canjear(cod)}catch(err){toast('Error: '+err.message);$('#entregar').disabled=false;return}
    const m={ok:'Canjeado ✓ — ya podés entregarlo',ya_canjeado:'Ojo: ya estaba canjeado',vencido:'Vencido: no se puede canjear',no_existe:'No existe'}[r.estado];
    await cargar();verCodigo(cod,m);
  };
  if($('#deshacer'))$('#deshacer').onclick=async()=>{
    if(!confirm('¿Deshacer el canje? El premio vuelve a quedar disponible.'))return;
    try{await deshacer(cod)}catch(err){toast('Error: '+err.message);return}
    await cargar();verCodigo(cod,'Canje deshecho: vuelve a estar disponible');
  };
}

function pintarResumen(){
  const hoy=hoyISO(), dia=x=>new Date(x).toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'});
  const hace7=new Date(Date.now()-7*864e5).toISOString();
  const gan=P.filter(x=>x.codigo), can=gan.filter(x=>x.canjeado), pend=gan.filter(x=>!x.canjeado&&x.vence>=hoy);
  const promos=J.filter(x=>x.acepta_promos).length;
  const c=(k,v,s)=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  $('#cards').innerHTML=
    c('Jugadas hoy',P.filter(x=>dia(x.creado)===hoy).length)+
    c('Últimos 7 días',P.filter(x=>x.creado>=hace7).length,`${new Set(P.filter(x=>x.creado>=hace7).map(x=>x.telefono)).size} personas`)+
    c('Jugadores',J.length,`${promos} aceptan promos`)+
    c('Premios dados',gan.length,`${P.length?Math.round(gan.length/P.length*100):0}% de las jugadas`)+
    c('Canjeados',can.length,`${pend.length} pendientes`);
}

function pintarTab(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  const n=P.filter(esPendiente).length, c=$('#cntPend');
  if(c){c.textContent=n||'';c.hidden=!n}
  ({pendientes:tabPendientes,canjeados:tabCanjeados,jugadores:tabJugadores,jugadas:tabJugadas,qr:tabQr})[tab]();
}
const esPendiente=x=>x.codigo&&!x.canjeado&&x.vence>=hoyISO();
const pedidoTxt=x=>x.pedido?`#${esc(x.pedido)}`:'—';
const quien=x=>`${esc(x.nombre||'')} <span class="sub">··· ${esc(String(x.telefono||'').slice(-3))}</span>`;
async function canjearFila(x,btn){
  if(!confirm(`¿Entregar "${x.premio}" a ${x.nombre}?\n\nPedido Glovo ${x.pedido?'#'+x.pedido:'—'} · código ${x.codigo}\n\nQueda marcado como canjeado.`))return;
  if(btn)btn.disabled=true;
  let r;try{r=await canjear(x.codigo)}catch(err){toast('Error: '+err.message);if(btn)btn.disabled=false;return}
  toast({ok:`Canjeado ✓ ${x.premio}`,ya_canjeado:'Ojo: ya estaba canjeado',vencido:'Vencido: no se puede canjear',no_existe:'No existe'}[r.estado]||r.estado);
  await cargar();
}
async function deshacerFila(x){
  if(!confirm(`¿Deshacer el canje de "${x.premio}" (${x.nombre})? Vuelve a quedar por canjear.`))return;
  try{await deshacer(x.codigo)}catch(err){toast('Error: '+err.message);return}
  toast('Canje deshecho');await cargar();
}
async function borrarFila(x,btn){
  const js=P.filter(j=>j.telefono===x.telefono), pend=js.filter(esPendiente).length, can=js.filter(j=>j.canjeado).length;
  const det=[`${js.length} ${js.length===1?'jugada':'jugadas'}`];
  if(pend)det.push(`${pend} ${pend===1?'premio sin canjear (deja de valer)':'premios sin canjear (dejan de valer)'}`);
  if(can)det.push(`${can} ${can===1?'premio ya canjeado (sale del historial)':'premios ya canjeados (salen del historial)'}`);
  if(!confirm(`¿Eliminar a ${x.nombre} (${telBonito(x.telefono)})?\n\nSe borran también: ${det.join(', ')}.\n\nNo se puede deshacer.`))return;
  if(btn)btn.disabled=true;
  let r;try{r=await borrarJugador(x.telefono)}catch(err){toast('Error: '+err.message);if(btn)btn.disabled=false;return}
  toast(r.estado==='ok'?`${x.nombre} eliminado`:'Ese jugador ya no existía');
  await cargar();
}
const TACHO='<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function csv(nombre,rows){
  const t='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=`${nombre}-${hoyISO()}.csv`;a.click();
}
function buscador(ph){return`<input type="search" id="q" placeholder="${ph}">`}
const coincide=(x,q)=>{if(!q)return true;const d=q.replace(/\D/g,'');
  return String(x.nombre||'').toLowerCase().includes(q.toLowerCase())||String(x.codigo||'').toLowerCase().includes(q.toLowerCase())||(d&&String(x.pedido||'').includes(d))};

function tabPendientes(){
  $('#panel').innerHTML=`<div class="bar">${buscador('Buscar pedido, nombre o código')}<span class="n" id="n"></span></div><div class="tw" id="tw"></div>`;
  const draw=()=>{
    const q=$('#q').value.trim();
    const L=P.filter(esPendiente).filter(x=>coincide(x,q)).sort((a,b)=>a.vence.localeCompare(b.vence));
    const venc=P.filter(x=>x.codigo&&!x.canjeado&&x.vence<hoyISO()).length;
    $('#n').textContent=`${L.length} por canjear${venc?` · ${venc} vencidos`:''}`;
    $('#tw').innerHTML=L.length?`<table><thead><tr><th>Pedido</th><th>Cliente</th><th>Premio</th><th>Código</th><th>Ganado</th><th>Vence</th><th></th></tr></thead><tbody>${
      L.map((x,i)=>`<tr><td class="code">${pedidoTxt(x)} <span class="sub">${fFecha(x.dia||x.creado).slice(0,5)}</span></td><td>${quien(x)}</td><td><b>${esc(x.premio)}</b></td>
        <td class="code">${esc(x.codigo)}</td><td>${fHora(x.creado)}</td><td>${fFecha(x.vence)}</td>
        <td class="act"><button class="btn ok mini" data-i="${i}">Canjear</button></td></tr>`).join('')
    }</tbody></table>`:'<div class="empty">No hay premios por canjear.</div>';

  };
  $('#q').oninput=draw;draw();
}
// ---------- Agrupar por día ----------
const diaDe=f=>new Date(f).toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'});
const soloHora=f=>f?new Date(f).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}):'';
const nombreDia=d=>{const t=new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1)};
const abiertos={};   // por solapa: qué días abrió o cerró a mano (se recuerda mientras la página está abierta)
// L: filas (de más nueva a más vieja) · fecha(x): fecha de la fila · cab: <th>… · fila(x,i): <tr>… · resumen(filas): texto del día
function porDia(cont,clave,L,{fecha,cab,fila,resumen,vacioHoy,todoAbierto}){
  const hoy=hoyISO(), g=new Map();
  L.forEach((x,i)=>{const d=diaDe(fecha(x));if(!g.has(d))g.set(d,[]);g.get(d).push([x,i])});
  const dias=[...g.keys()].sort().reverse();
  if(!todoAbierto&&!dias.includes(hoy))dias.unshift(hoy);           // hoy siempre está, aunque esté vacío
  const mem=abiertos[clave]=abiertos[clave]||{};
  cont.className='dias';
  cont.innerHTML=dias.map(d=>{
    const filas=g.get(d)||[], open=todoAbierto||(d in mem?mem[d]:d===hoy);
    return`<details class="dia" data-d="${d}"${open?' open':''}><summary><b>${esc(nombreDia(d))}</b>${d===hoy?'<span class="hoy">Hoy</span>':''}<span class="r">${esc(resumen(filas.map(f=>f[0])))}</span></summary>${
      filas.length?`<div class="tw"><table><thead><tr>${cab}</tr></thead><tbody>${filas.map(([x,i])=>fila(x,i)).join('')}</tbody></table></div>`:`<div class="empty">${esc(vacioHoy)}</div>`}</details>`;
  }).join('');
  if(!todoAbierto)cont.querySelectorAll('details.dia').forEach(el=>el.addEventListener('toggle',()=>{mem[el.dataset.d]=el.open}));
}

function tabCanjeados(){
  $('#panel').innerHTML=`<div class="bar">${buscador('Buscar pedido, nombre o código')}<button class="btn sec" id="csv">Descargar CSV</button><span class="n" id="n"></span></div><div id="tw"></div>`;
  let L=[];
  const draw=()=>{
    const q=$('#q').value.trim();
    L=P.filter(x=>x.canjeado).filter(x=>coincide(x,q)).sort((a,b)=>b.canjeado.localeCompare(a.canjeado));
    const mes=hoyISO().slice(0,7), delMes=L.filter(x=>new Date(x.canjeado).toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'}).startsWith(mes)).length;
    $('#n').textContent=`${L.length} canjeados · ${delMes} este mes`;
    porDia($('#tw'),'canjeados',L,{
      fecha:x=>x.canjeado, todoAbierto:!!q,
      cab:'<th>Hora</th><th>Pedido</th><th>Cliente</th><th>Premio</th><th>Código</th><th>Ganado</th><th>Lo entregó</th><th></th>',
      fila:(x,i)=>`<tr><td><b>${soloHora(x.canjeado)}</b></td><td class="code">${pedidoTxt(x)} <span class="sub">${fFecha(x.dia||x.creado).slice(0,5)}</span></td><td>${quien(x)}</td><td>${esc(x.premio)}</td>
        <td class="code">${esc(x.codigo)}</td><td>${fHora(x.creado)}</td><td>${esc(x.canjeado_por||'')}</td>
        <td class="act">${(Date.now()-new Date(x.canjeado))<12*3600e3?`<button class="btn sec mini" data-i="${i}">Deshacer</button>`:''}</td></tr>`,
      resumen:f=>f.length?`${f.length} ${f.length===1?'canjeado':'canjeados'}`:'',
      vacioHoy:q?'Nada con esa búsqueda.':'Hoy todavía no se canjeó ningún premio.'});
    if(q&&!L.length)$('#tw').innerHTML='<div class="empty">Nada con esa búsqueda.</div>';
    document.querySelectorAll('#tw button[data-i]').forEach(b=>b.onclick=()=>deshacerFila(L[b.dataset.i]));
  };
  $('#q').oninput=draw;
  $('#csv').onclick=()=>csv('terrys-canjeados',[['Canjeado','Pedido','Dia pedido','Cliente','Movil','Premio','Codigo','Ganado','Lo entrego'],
    ...L.map(x=>[fHora(x.canjeado),x.pedido?'#'+x.pedido:'',fFecha(x.dia||x.creado),x.nombre,x.telefono,x.premio,x.codigo,fHora(x.creado),x.canjeado_por||''])]);
  draw();
}
function tabJugadores(){
  $('#panel').innerHTML=`<div class="bar"><input type="search" id="q" placeholder="Buscar nombre, móvil, email o pedido"><label><input type="checkbox" id="sp"> Solo aceptan promos</label>
    <button class="btn sec" id="csv">Descargar CSV</button><span class="n" id="n"></span></div><div class="tw" id="tw"></div>`;
  const draw=()=>{
    const q=$('#q').value.trim().toLowerCase(), sp=$('#sp').checked;
    const peds={};for(const x of P)if(x.pedido)(peds[x.telefono]=peds[x.telefono]||[]).push(x.pedido);
    const d=q.replace(/\D/g,'');
    const L=J.filter(x=>(!sp||x.acepta_promos)&&(!q||[x.nombre,x.telefono,x.email].join(' ').toLowerCase().includes(q)||(d.length===3&&(peds[x.telefono]||[]).includes(d))));
    $('#n').textContent=`${L.length} de ${J.length}`;
    const ult={};for(const x of P)if(x.pedido&&!ult[x.telefono])ult[x.telefono]=x;   // P va de más nueva a más vieja
    $('#tw').innerHTML=L.length?`<table><thead><tr><th>Nombre</th><th>Último pedido</th><th>Móvil</th><th>Email</th><th>Promos</th><th class="num">Jugadas</th><th class="num">Premios</th><th>Origen</th><th>Primera vez</th><th>Última</th><th></th></tr></thead><tbody>${
      L.slice(0,500).map((x,i)=>`<tr><td>${esc(x.nombre)}</td><td class="code">${ult[x.telefono]?pedidoTxt(ult[x.telefono])+` <span class="sub">${fFecha(ult[x.telefono].dia||ult[x.telefono].creado).slice(0,5)}</span>`:''}</td><td><a href="https://wa.me/${esc(String(x.telefono).replace(/\D/g,''))}" target="_blank" rel="noopener">${esc(telBonito(x.telefono))}</a></td><td>${esc(x.email||'')}</td>
        <td><span class="pill ${x.acepta_promos?'si':'no'}">${x.acepta_promos?'Sí':'No'}</span></td><td class="num">${x.jugadas}</td><td class="num">${x.premios}</td><td>${esc(x.origen||'')}</td><td>${fFecha(x.primera_jugada)}</td><td>${fHora(x.ultima_jugada)}</td>
        <td class="act"><button class="tacho" type="button" data-b="${i}" title="Eliminar jugador" aria-label="Eliminar a ${esc(x.nombre)}">${TACHO}</button></td></tr>`).join('')
    }</tbody></table>`:'<div class="empty">Todavía no jugó nadie.</div>';
    document.querySelectorAll('#tw button[data-b]').forEach(b=>b.onclick=()=>borrarFila(L[b.dataset.b],b));
    return L;
  };
  $('#q').oninput=draw;$('#sp').onchange=draw;
  $('#csv').onclick=()=>{
    const L=draw();
    const ult={};for(const x of P)if(x.pedido&&!ult[x.telefono])ult[x.telefono]=x;
    const rows=[['Nombre','Ultimo pedido','Movil','Email','Acepta promos','Jugadas','Premios','Origen','Primera vez','Ultima jugada'],
      ...L.map(x=>[x.nombre,ult[x.telefono]?'#'+ult[x.telefono].pedido:'',x.telefono,x.email||'',x.acepta_promos?'Si':'No',x.jugadas,x.premios,x.origen||'',fFecha(x.primera_jugada),fHora(x.ultima_jugada)])];
    const csv='﻿'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`terrys-jugadores-${hoyISO()}.csv`;a.click();
  };
  draw();
}
function tabJugadas(){
  $('#panel').innerHTML=`<div class="bar"><input type="search" id="qp" placeholder="Buscar pedido o nombre"><select id="f" style="padding:10px;border-radius:10px;background:var(--paper);border:1px solid var(--line-2)">
    <option value="">Todas</option><option value="gan">Con premio</option><option value="pend">Premios sin canjear</option><option value="can">Canjeados</option></select><span class="n" id="n"></span></div><div id="tw"></div>`;
  const draw=()=>{
    const f=$('#f').value, hoy=hoyISO(), q=$('#qp').value.trim().toUpperCase();
    const L=P.filter(x=>(!q||String(x.pedido||'').includes(q.replace(/[^A-Z0-9]/g,''))||String(x.nombre||'').toUpperCase().includes(q))).filter(x=>!f||(f==='gan'&&x.codigo)||(f==='pend'&&x.codigo&&!x.canjeado&&x.vence>=hoy)||(f==='can'&&x.canjeado));
    $('#n').textContent=`${L.length} jugadas`;
    const filtrando=!!(q||f);
    porDia($('#tw'),'jugadas',L,{
      fecha:x=>x.creado, todoAbierto:filtrando,
      cab:'<th>Hora</th><th>Nombre</th><th>Pedido</th><th>Resultado</th><th>Código</th><th>Estado</th><th>Origen</th><th></th>',
      fila:(x,i)=>{
        const est=!x.codigo?'':x.canjeado?`<span class="pill can">Canjeado ${fFecha(x.canjeado)}</span>`:x.vence<hoy?'<span class="pill ven">Vencido</span>':`<span class="pill gan">Pendiente · vence ${fFecha(x.vence)}</span>`;
        return`<tr><td>${soloHora(x.creado)}</td><td>${esc(x.nombre||'')}</td><td class="code">${x.pedido?'#'+esc(x.pedido):''}</td><td>${x.codigo?`<b>${esc(x.premio)}</b>`:'<span style="color:var(--muted)">Sin premio</span>'}</td>
          <td>${x.codigo?`<a href="#" class="code" data-c="${esc(x.codigo)}">${esc(x.codigo)}</a>`:''}</td><td>${est}</td><td>${esc(x.origen||'')}</td>
          <td class="act">${esPendiente(x)?`<button class="btn ok mini" data-i="${i}">Canjear</button>`:''}</td></tr>`},
      resumen:fl=>{if(!fl.length)return'';const g=fl.filter(x=>x.codigo).length;return`${fl.length} ${fl.length===1?'jugada':'jugadas'} · ${g} con premio`},
      vacioHoy:'Hoy todavía no jugó nadie.'});
    if(filtrando&&!L.length)$('#tw').innerHTML='<div class="empty">No hay jugadas con esa búsqueda.</div>';
    document.querySelectorAll('#tw a[data-c]').forEach(a=>a.onclick=e=>{e.preventDefault();scrollTo({top:0,behavior:'smooth'});verCodigo(a.dataset.c)});
    document.querySelectorAll('#tw button[data-i]').forEach(b=>b.onclick=()=>canjearFila(L[b.dataset.i],b));
  };
  $('#f').onchange=draw;$('#qp').oninput=draw;draw();
}
function tabQr(){
  const base=new URL('./',location.href).href;
  $('#panel').innerHTML=`<div class="qr"><div>
      <p>Este es el QR que va en el flyer de los pedidos. Lleva a la ruleta. Con <b>origen</b> podés saber de dónde vino cada jugador (por ejemplo <i>flyer</i>, <i>glovo</i>, <i>mesa</i>): se guarda la primera vez que juega.</p>
      <label for="qb">Dirección de la ruleta</label><input type="url" id="qb" value="${esc(base)}">
      <label for="qo">Origen</label><input type="text" id="qo" value="flyer" maxlength="40">
      <div class="bar" style="margin-top:14px"><button class="btn" id="png">Descargar PNG</button><button class="btn sec" id="svg">Descargar SVG (imprenta)</button></div>
    </div><div><div class="qrbox" id="qrbox"></div><div class="qrurl" id="qrurl"></div></div></div>`;
  let qr,url;
  const draw=()=>{
    const o=$('#qo').value.replace(/[^\w-]/g,'');
    url=$('#qb').value.trim()+(o?(($('#qb').value.includes('?')?'&':'?')+'o='+o):'');
    qr=qrcode(0,'M');qr.addData(url);qr.make();
    const n=qr.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    $('#qrbox').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#141311"/></svg>`;
    $('#qrurl').textContent=url;
  };
  const bajar=(href,name)=>{const a=document.createElement('a');a.href=href;a.download=name;a.click()};
  $('#qb').oninput=draw;$('#qo').oninput=draw;
  $('#svg').onclick=()=>bajar(URL.createObjectURL(new Blob([$('#qrbox').innerHTML],{type:'image/svg+xml'})),'qr-terrys-premios.svg');
  $('#png').onclick=()=>{
    const n=qr.getModuleCount(),m=4,s=24,cv=document.createElement('canvas');cv.width=cv.height=(n+2*m)*s;
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#141311';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))x.fillRect((c+m)*s,(r+m)*s,s,s);
    bajar(cv.toDataURL('image/png'),'qr-terrys-premios.png');
  };
  draw();
}
