<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terry's · Chequeos</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141311">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f1ede5'/%3E%3Ctext x='50' y='76' font-family='Impact,sans-serif' font-size='72' text-anchor='middle' fill='%23141311'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Página de chequeos del local: ruleta, próximas reservas y cierre de caja (arqueo por billetes y monedas).
   Entra el usuario de caja (o un admin). Misma estética que local.html. */
:root{
  color-scheme:dark;
  --paper:#141311; --surface:#1d1b18; --surface-2:#26231f; --ink:#f1ede5; --ink-2:#c9c3b7; --muted:#8f887b; --line:#332f29; --line-2:#453f37;
  --out:#e0693f; --out-soft:#40221a; --out-ink:#f4b9a1;
  --accent:#5c9fc4; --accent-soft:#1b2f3b;
  --ok:#5cb47f; --ok-soft:#1c3326; --warn:#e29a4a; --warn-soft:#3a3010; --danger:#e5665e; --gold:#f2c14e;
  --display:"Bebas Neue","Impact","Arial Narrow",sans-serif; --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--out-ink)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wordmark{font-family:var(--display);font-size:30px;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:10px}
.wordmark small{font-family:var(--body);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
.me{font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--out-ink);text-decoration:underline;cursor:pointer;font-size:13px}
.btn{padding:11px 16px;border-radius:10px;border:0;background:var(--out);color:#1a0f09;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);font-weight:600}
.btn.ok{background:var(--ok);color:#0d1a12}
.btn.mini{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],input[type=url],select,textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--paper);width:100%}
input:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--out);outline-offset:1px}
h2{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.03em;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px}

/* Login */
.login{max-width:360px;margin:12vh auto 0;padding:26px 22px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.login h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.login p{color:var(--ink-2);margin:6px 0 16px}
.login label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 5px;font-weight:600}
.login .btn{width:100%;margin-top:18px}
.msg{margin-top:12px;font-size:14px;color:var(--danger);min-height:1em}
.msg.ok{color:var(--ok)}
.login .olvide{display:block;margin:14px auto 0;background:none;border:0;color:var(--out-ink);text-decoration:underline;cursor:pointer;font-size:13px}

/* Solapas */
.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--out)}
.tabs .cnt,.subtabs .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--out);color:#1a0f09;font-size:12px;line-height:18px;text-align:center}
.tabs .cnt:empty,.subtabs .cnt:empty{display:none}
.subtabs{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;padding:2px}
.subtabs button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--ink-2);font-weight:600;cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel{padding-top:16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 10px}
.bar .n{color:var(--muted);font-size:13px;margin-left:auto}
.bar input[type=search]{max-width:280px}
.bar label{font-size:13px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.bar label input{width:auto}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.card .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .v{font-family:var(--display);font-size:34px;line-height:1;margin-top:4px}
.card .s{font-size:12px;color:var(--ink-2);margin-top:2px}

/* Tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrapc{white-space:normal;min-width:180px;max-width:360px;color:var(--ink-2)}
td.act{text-align:right}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.si{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--surface-2);color:var(--muted)}
.pill.gan{background:var(--warn-soft);color:var(--gold)} .pill.can{background:var(--accent-soft);color:var(--accent)} .pill.ven{background:var(--out-soft);color:var(--out-ink)}
.pos{color:var(--ok)} .neg{color:var(--danger)}
.tacho{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line-2);background:none;color:var(--muted);cursor:pointer;vertical-align:middle}
.tacho:hover,.tacho:focus-visible{color:var(--danger);border-color:var(--danger);background:var(--out-soft)}

/* Canje */
.canje{margin-top:16px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.canje .cf{display:flex;gap:8px;margin-top:10px}
.canje input{font-family:var(--display);font-size:30px;letter-spacing:.14em;text-transform:uppercase;padding:8px 14px}
.canje input::placeholder{letter-spacing:.08em;opacity:.35}
.res{margin-top:14px}
.tk{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:14px 16px;border-radius:12px;border:2px solid var(--line-2);background:var(--paper)}
.tk.valido{border-color:var(--ok)} .tk.vencido{border-color:var(--warn)} .tk.usado{opacity:.9}
.tk .st{grid-column:1/-1;font-family:var(--display);font-size:28px;letter-spacing:.04em;line-height:1}
.tk.valido .st{color:var(--ok)} .tk.vencido .st{color:var(--warn)} .tk.usado .st{color:var(--muted)}
.tk .prem{grid-column:1/-1;font-size:20px;font-weight:700;margin-bottom:6px}
.tk dt{color:var(--muted)} .tk dd{font-weight:600}
.tk .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.nf{padding:12px 14px;border-radius:12px;background:var(--out-soft);color:var(--out-ink)}

/* Un bloque por día */
.dias{display:grid;gap:8px}
.dia{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.dia>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 14px;user-select:none}
.dia>summary::-webkit-details-marker{display:none}
.dia>summary::before{content:"";flex:none;width:0;height:0;border:5px solid transparent;border-left:7px solid var(--muted);transition:transform .15s}
.dia[open]>summary::before{transform:rotate(90deg) translateX(2px)}
.dia>summary b{font-family:var(--display);font-weight:400;font-size:20px;letter-spacing:.04em}
.dia>summary .hoy{background:var(--out);color:#1a0f09;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.dia>summary .r{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.dia[open]>summary{border-bottom:1px solid var(--line)}
.dia .tw{border:0;border-radius:0}
.dia .empty{padding:16px}
/* QR del flyer */
.qr{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start;margin-top:12px}
@media (max-width:700px){.qr{grid-template-columns:1fr}}
.qr label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:12px 0 5px;font-weight:600}
.qr p{color:var(--ink-2);font-size:14px}
.qrbox{background:#fff;border-radius:14px;padding:14px;display:grid;place-items:center}
.qrbox svg{width:100%;height:auto;display:block}
.qrurl{font-size:12px;color:var(--muted);word-break:break-all;margin-top:8px}
.aviso{padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-size:14px;margin-bottom:12px}

/* Cierre de caja: arqueo por billetes y monedas, pensado para cargar con el dedo en el iPad */
.cierre{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
.caja{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.caja h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 0 5px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.caja h3 .lnk{text-transform:none;letter-spacing:0;font-weight:500}
.filas{display:flex;flex-wrap:wrap;gap:0 22px}
.cab{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap}
.fila{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;margin-top:10px}
.fila>.et{flex:none;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:12px;overflow:hidden}
.seg button{min-height:42px;padding:0 18px;border:0;background:none;color:var(--ink-2);font-weight:700;font-size:16px;cursor:pointer;touch-action:manipulation}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:8px;flex-wrap:wrap;border-radius:14px}
.chips.falta{outline:2px solid var(--out);outline-offset:4px}
.chip{min-height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:none;color:var(--ink-2);font-weight:700;font-size:16px;cursor:pointer;touch-action:manipulation;box-shadow:inset 0 -3px 0 var(--u,transparent)}
.chip[aria-pressed=true]{background:var(--u,var(--ink));color:#141311;border-color:transparent}
.chip.otro{border-style:dashed;font-weight:600;box-shadow:none}
.fechanav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fechanav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-size:22px;line-height:1;cursor:pointer;touch-action:manipulation}
.fechanav button:disabled{opacity:.35;cursor:default}
.fechanav input[type=date]{width:auto;min-height:40px;padding:6px 10px;font-weight:700;font-size:15px}
.fechanav .cual{color:var(--ink-2);font-size:14px;margin-right:4px}
.estado-form{margin-top:10px;font-size:13px;padding:7px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.estado-form:empty{display:none}
/* Dos columnas que se leen de arriba abajo: 200·100·50 a la izquierda y 20·10·5 a la derecha (igual las monedas) */
.dens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;gap:5px 8px}
.dens.b{grid-template-rows:repeat(3,auto)} .dens.m{grid-template-rows:repeat(4,auto)}
.den{display:grid;grid-template-columns:60px 44px minmax(40px,1fr) 44px minmax(64px,auto);align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.den.act{border-color:var(--out)}
.den .dv{font-family:var(--display);font-size:23px;letter-spacing:.03em;line-height:1;white-space:nowrap}
.den .pm{width:44px;height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);font-size:24px;line-height:1;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.den .pm:active,.tecl .keys button:active{background:var(--line-2)}
.den .dn{height:38px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;cursor:pointer;touch-action:manipulation}
.den .di{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;white-space:nowrap}
.den.cero .dn{color:var(--muted);font-weight:500} .den.cero .di{color:var(--muted)}
.resumen{position:sticky;top:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.resumen .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.resumen .tot{font-family:var(--display);font-size:48px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.resumen .partes{font-size:13px;color:var(--ink-2);margin-top:6px}
.veredicto{margin-top:14px;padding:12px;border-radius:12px;text-align:center;font-family:var(--display);font-size:26px;letter-spacing:.03em;line-height:1.05}
.veredicto small{display:block;font-family:var(--body);font-size:13px;letter-spacing:0;margin-top:4px;font-weight:600}
.veredicto.ok{background:var(--ok-soft);color:var(--ok)} .veredicto.mal{background:var(--out-soft);color:var(--danger)} .veredicto.nada{background:var(--surface-2);color:var(--ink-2)}
.resumen .btn{width:100%;margin-top:12px;min-height:52px;font-size:18px}
@media (max-width:980px){
  .cierre{grid-template-columns:1fr}
  .resumen{top:auto;bottom:8px;z-index:5;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:12px 14px;box-shadow:0 -10px 28px rgba(0,0,0,.55)}
  .resumen .tot{font-size:40px}
  .resumen .veredicto{grid-column:1/-1;order:3;margin-top:0;padding:8px;font-size:20px}
  .resumen .veredicto small{display:inline;margin-left:6px}
  .resumen .btn{width:auto;margin-top:0;padding:0 22px}
}
@media (max-width:680px){
  .dens,.dens.b,.dens.m{grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none}
}
@media (max-width:420px){
  .caja{padding:12px}
  .den{grid-template-columns:54px 44px minmax(40px,1fr) 44px minmax(64px,auto);gap:5px;padding:4px 6px}
  .den .dv{font-size:21px}
  .fila>.et{width:100%}
  .fechanav{justify-content:flex-start}
}
/* Teclado propio en pantalla (no abre el del iPad) */
.tecl{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:grid;place-items:center;padding:16px}
.tecl .box{width:min(360px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:18px}
.tecl .tt{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tecl .vis{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:8px 0 12px;padding:10px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line-2)}
.tecl .vis b{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.tecl .vis span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.tecl .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tecl .keys button{height:64px;border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);font-size:26px;font-weight:600;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.tecl .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.tecl .acts.solo{grid-template-columns:1fr}
.tecl .acts .btn{height:56px;font-size:17px;padding:0 10px}
/* Planilla: como la hoja de siempre, una fila por arqueo con el color de quien lo hizo */
.plan td,.plan th{padding:8px 10px}
.plan tbody tr:not(.mes) td{background:color-mix(in oklab,var(--u,transparent) 13%,var(--surface))}
.plan tbody tr:not(.mes) td:first-child{box-shadow:inset 4px 0 0 var(--u,transparent)}
.plan tr.mes td{font-family:var(--display);font-size:18px;letter-spacing:.06em;color:var(--ink-2);background:var(--paper);text-align:center}
.plan .z{color:var(--muted);opacity:.55}
.plan td.dif{color:var(--ink-2)}

.demo{position:fixed;left:50%;bottom:0;transform:translateX(-50%);background:var(--out-soft);color:var(--out-ink);font-size:12px;padding:3px 10px;border-radius:8px 8px 0 0;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Los mismos valores que en local.html. Con ?demo en la dirección se prueba sin base (datos de este navegador).
const SUPABASE_URL='https://cgkpklimplpedgxbgzvu.supabase.co';
const SUPABASE_KEY='sb_publishable_yG1hrdoynoxBBYh9LX7QpA_we_bb_qC';

const URL_RULETA='https://ruleta.terrysburgers.com/';   // la ruleta de los clientes y local.html viven ahí
const QS=new URLSearchParams(location.search);
const DEMO=QS.has('demo'), SB=!DEMO&&!!(SUPABASE_URL&&SUPABASE_KEY);
// Misma sesión que local.html (mismo storageKey): si ya entraste ahí, acá también.
const sbc=SB?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storageKey:'terrys-premios-local',flowType:'implicit'}}):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoyISO=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'});
const sumarDias=(d,n)=>{const x=new Date(d+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const fFecha=d=>d?new Date(d.length===10?d+'T12:00:00':d).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'Europe/Madrid'}):'';
const fHora=d=>d?new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}):'';
const soloHora=d=>d?new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'}):'';
const nombreDia=d=>{const t=new Date(d+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});return t.charAt(0).toUpperCase()+t.slice(1)};

function verifTxt(t){
  if(!t||!t.verif||t.verif==='manual')return'';   // sin cruce con Ágora: se controla a mano
  if(t.verif==='ok')return`<span class="pill si" title="Está en Ágora">✓ Ágora${t.importe!=null?' · '+Number(t.importe).toFixed(2).replace('.',',')+' €':''}${t.canal?' · '+esc(t.canal):''}</span>`;
  if(t.verif==='no')return'<span class="pill ven" title="Ese día ya está cargado y el ticket no aparece">✗ No está en Ágora</span>';
  return`<span class="pill gan" title="Ágora sube las ventas cada noche">⏳ ${t.fecha_ticket>=hoyISO()?'Se verifica mañana':'Pendiente de Ágora'}</span>`;
}
function origenTxt(x,corto){

async function borrarFila(x,btn){

  if(can)det.push(`${can} ${can===1?'premio ya canjeado (sale del historial)':'premios ya canjeados (salen del historial)'}`);

// Una lista con un bloque por día. L: filas (de más nueva a más vieja) · fecha(x) · cab: <th>… · fila(x,i): <tr>… · resumen(filas)
function porDia(cont,clave,L,{fecha,cab,fila,resumen,vacioHoy,todoAbierto}){
  const hoy=hoyISO(), g=new Map();
  L.forEach((x,i)=>{const d=diaDe(fecha(x));if(!g.has(d))g.set(d,[]);g.get(d).push([x,i])});
  const dias=[...g.keys()].sort().reverse();
  if(!todoAbierto&&!dias.includes(hoy))dias.unshift(hoy);   // hoy siempre está, aunque esté vacío
  const mem=abiertosR[clave]=abiertosR[clave]||{};
  cont.className='dias';
  cont.innerHTML=dias.map(d=>{
    const filas=g.get(d)||[], open=todoAbierto||(d in mem?mem[d]:d===hoy);
    return`<details class="dia" data-d="${d}"${open?' open':''}><summary><b>${esc(nombreDia(d))}</b>${d===hoy?'<span class="hoy">Hoy</span>':''}<span class="r">${esc(resumen(filas.map(f=>f[0])))}</span></summary>${
      filas.length?`<div class="tw"><table><thead><tr>${cab}</tr></thead><tbody>${filas.map(([x,i])=>fila(x,i)).join('')}</tbody></table></div>`:`<div class="empty">${esc(vacioHoy)}</div>`}</details>`;
  }).join('');
  if(!todoAbierto)cont.querySelectorAll('details.dia').forEach(el=>el.addEventListener('toggle',()=>{mem[el.dataset.d]=el.open}));
}

// QR del flyer (solo admin). La librería se baja recién cuando se abre esta parte.
function subQr(){
  rDraw=null;
  $('#rpanel').innerHTML=`<div class="qr"><div>
      <p>Este es el QR que va en el flyer de los pedidos. Lleva a la ruleta. Con <b>origen</b> podés saber de dónde vino cada jugador (por ejemplo <i>flyer</i>, <i>glovo</i>, <i>mesa</i>): se guarda la primera vez que juega.</p>
      <label for="qb">Dirección de la ruleta</label><input type="url" id="qb" value="${esc(URL_RULETA)}">
      <label for="qo">Origen</label><input type="text" id="qo" value="flyer" maxlength="40">
      <div class="bar" style="margin-top:14px"><button class="btn" id="png">Descargar PNG</button><button class="btn sec" id="svg">Descargar SVG (imprenta)</button></div>
    </div><div><div class="qrbox" id="qrbox"></div><div class="qrurl" id="qrurl"></div></div></div>`;
  let qr;
  const draw=()=>{
    if(!window.qrcode||!$('#qb'))return;
    const o=$('#qo').value.replace(/[^\w-]/g,''), b=$('#qb').value.trim(), url=b+(o?((b.includes('?')?'&':'?')+'o='+o):'');
    qr=qrcode(0,'M');qr.addData(url);qr.make();
    const n=qr.getModuleCount(),m=4;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;
    $('#qrbox').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#141311"/></svg>`;
    $('#qrurl').textContent=url;
  };
  const bajar=(href,name)=>{const a=document.createElement('a');a.href=href;a.download=name;a.click()};
  $('#qb').oninput=draw;$('#qo').oninput=draw;
  $('#svg').onclick=()=>{if(qr)bajar(URL.createObjectURL(new Blob([$('#qrbox').innerHTML],{type:'image/svg+xml'})),'qr-terrys-premios.svg')};
  $('#png').onclick=()=>{
    if(!qr)return;
    const n=qr.getModuleCount(),m=4,s=24,cv=document.createElement('canvas');cv.width=cv.height=(n+2*m)*s;
    const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#141311';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))x.fillRect((c+m)*s,(r+m)*s,s,s);
    bajar(cv.toDataURL('image/png'),'qr-terrys-premios.png');
  };
  if(window.qrcode)draw();
  else{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js';sc.onload=draw;
    sc.onerror=()=>{if($('#qrbox'))$('#qrbox').innerHTML='<div class="empty" style="color:#141311">No se pudo cargar el generador de QR. Revisá la conexión.</div>'};document.head.appendChild(sc)}
}
async function verCodigo(raw,msg){
  const cod=normCodigo(raw), box=$('#cr');
  if(!cod){box.innerHTML='<div class="nf">El código tiene 5 letras o números, por ejemplo T-K7P3Q.</div>';return}
  $('#ci').value=cod;
  let j;try{j=await rpc('premios_buscar_codigo',{p_codigo:cod})}catch(err){box.innerHTML=`<div class="nf">No se pudo buscar: ${esc(err.message)}</div>`;return}
  if(!j){box.innerHTML=`<div class="nf">No existe ningún premio con el código <b>${esc(cod)}</b>. Revisá que esté bien escrito.</div>`;return}
  const vencido=!j.canjeado&&j.vence<hoyISO(), sinReg=!j.registrado;
  const cls=j.canjeado?'usado':(vencido||sinReg)?'vencido':'valido';
  const st=j.canjeado?`Ya canjeado el ${fHora(j.canjeado)}`:sinReg?'Sin registrar: el cliente todavía no se registró':vencido?`Vencido el ${fFecha(j.vence)}`:'Válido ✓';
  const recien=j.canjeado&&(Date.now()-new Date(j.canjeado))<12*3600e3;
  const origen=j.ticket!=null?`Ticket ${esc(j.ticket)}${j.fecha_ticket?' del '+fFecha(j.fecha_ticket):''}`:j.pedido?`Pedido #${esc(j.pedido)}`:'Bienvenida (folleto)';
  const fila=RP.find(x=>x.codigo===j.codigo), tk=fila&&fila.ticket!=null&&RT[fila.k+'|'+fila.ticket];
  box.innerHTML=`<div class="tk ${cls}">
    <div class="st">${esc(msg||st)}</div><div class="prem">${esc(j.premio)}</div>
    <dt>Código</dt><dd class="code">${esc(j.codigo)}</dd>
    <dt>A nombre de</dt><dd>${esc(j.nombre||'')}</dd>
    <dt>Móvil</dt><dd>${j.registrado?`··· ${esc(j.tel3||'')} <span class="sub" style="font-weight:400">(pedile que te diga los últimos 3)</span>`:'—'}</dd>
    <dt>Origen</dt><dd>${origen}${tk&&tk.verif==='no'?'<div style="color:var(--danger);font-weight:600;margin-top:4px">Ojo: ese ticket no aparece en Ágora. Revisalo antes de entregar.</div>':''}</dd>
    <dt>Ganado</dt><dd>${esc(fHora(j.creado))}</dd>
    <dt>Vence</dt><dd>${esc(fFecha(j.vence))}</dd>
    ${j.canjeado&&j.canjeado_por?`<dt>Canjeó</dt><dd>${esc(j.canjeado_por)}</dd>`:''}
    <div class="acts">
      ${cls==='valido'?'<button class="btn ok" id="entregar">Entregar y marcar canjeado</button>':''}
      ${recien?'<button class="btn sec" id="deshacer">Deshacer canje</button>':''}
      <button class="btn sec" id="limpiar">Otro código</button>
    </div></div>`;
  $('#limpiar').onclick=()=>{box.innerHTML='';$('#ci').value=''};
  if($('#entregar'))$('#entregar').onclick=async()=>{
    if(!confirm(`¿Entregar "${j.premio}" a ${j.nombre}? Queda marcado como canjeado.`))return;
    $('#entregar').disabled=true;
    let r;try{r=await rpc('premios_canjear',{p_codigo:cod})}catch(err){toast('Error: '+err.message);$('#entregar').disabled=false;return}
    await cargarRuleta();
    verCodigo(cod,{ok:'Canjeado ✓ — ya podés entregarlo',ya_canjeado:'Ojo: ya estaba canjeado',vencido:'Vencido: no se puede canjear',no_existe:'No existe'}[r.estado]);
  };
  if($('#deshacer'))$('#deshacer').onclick=async()=>{
    if(!confirm('¿Deshacer el canje? El premio vuelve a quedar disponible.'))return;
    try{await rpc('premios_deshacer_canje',{p_codigo:cod})}catch(err){toast('Error: '+err.message);return}
    await cargarRuleta();verCodigo(cod,'Canje deshecho: vuelve a estar disponible');
  };
}

        L.map(r=>`<tr><td><b>${esc(r.hora)}</b></td><td class="num"><b>${r.personas}</b></td><td>${esc(r.nombre)}</td>
          <td><a href="tel:${esc(String(r.telefono).replace(/[^\d+]/g,''))}">${esc(telBonito(r.telefono))}</a></td>
          <td><span class="pill ${r.estado==='confirmada'?'si':'gan'}">${r.estado==='confirmada'?'Confirmada':'Sin confirmar'}</span></td>
          <td class="wrapc">${esc(r.comentario||'')}${r.nota?`<div class="sub">Nota: ${esc(r.nota)}</div>`:''}</td></tr>`).join('')
      }</tbody></table></div>`:'<div class="empty">Hoy no hay reservas de la web.</div>'}</details>`;
  }).join('');
  cont.querySelectorAll('details.dia').forEach(el=>el.addEventListener('toggle',()=>{abiertos[el.dataset.d]=el.open}));
}

// ---------- Cierre de caja: arqueo por billetes y monedas ----------
// Lo mismo que la planilla de siempre (día, turno, apertura/cierre, quién y cuánto hay de cada
// billete y moneda), pero para el dedo: − / + y un teclado propio en pantalla, sin el del iPad.
// Arranca con lo que había en el arqueo anterior: solo se toca lo que cambió.
const DENS=[200,100,50,20,10,5,2,1,0.5,0.2,0.1,0.05,0.02,0.01];
const dNom=d=>d>=1?d+' €':d.toFixed(2).replace('.',',')+' €';
const dQue=d=>(d>=5?'Billetes de ':'Monedas de ')+dNom(d);
const TUR={dia:'Día',noche:'Noche'}, EST={apertura:'Apertura',cierre:'Cierre'};
const USU_BASE=['Juan','Matías'];   // los demás se suman con «+ Otro» y quedan guardados con su primer arqueo
const COLOR_U={juan:'#5cb47f',magui:'#f2c14e',matias:'#5c9fc4'}, COLOR_X=['#e0693f','#c58fd6','#7fd0c2','#d9a37f'];
const sinTilde=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
let ARQ=[], USUARIOS=[...USU_BASE], formSucio=false, sel=null, pz={}, quien='';
const colorU=u=>{const k=sinTilde(u);if(COLOR_U[k])return COLOR_U[k];const i=USUARIOS.map(sinTilde).filter(x=>!COLOR_U[x]).indexOf(k);return COLOR_X[(i<0?0:i)%COLOR_X.length]};
const sumarUsuario=u=>{u=String(u||'').trim();if(u.length>=2&&!USUARIOS.some(x=>sinTilde(x)===sinTilde(u)))USUARIOS.push(u)};
const ordA=a=>a.fecha+(a.turno==='noche'?'1':'0')+(a.estado==='cierre'?'1':'0');
const totalPz=(p,ds=DENS)=>ds.reduce((s,d)=>s+(p[d]||0)*Math.round(d*100),0)/100;
const fCorta=d=>d.slice(8,10)+'/'+d.slice(5,7);
const descA=a=>`${EST[a.estado].toLowerCase()} ${a.turno==='dia'?'del día':'de la noche'} del ${fCorta(a.fecha)} · ${a.usuario}`;
const existente=s=>ARQ.find(a=>a.fecha===s.fe&&a.turno===s.tu&&a.estado===s.es);
const anterior=s=>{const k=ordA({fecha:s.fe,turno:s.tu,estado:s.es});return ARQ.find(a=>ordA(a)<k)};   // ARQ viene del más nuevo al más viejo
const editable=fe=>esAdmin||fe>=sumarDias(hoyISO(),-2);
const horaMadrid=()=>+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Europe/Madrid'}).slice(0,2);
function porDefecto(){
  const h=horaMadrid(), hoy=hoyISO();
  if(h<6)return{fe:sumarDias(hoy,-1),tu:'noche',es:'cierre'};   // el cierre de la noche se hace pasada la medianoche
  if(h>=18)return{fe:hoy,tu:'noche',es:'cierre'};
  const ap={fe:hoy,tu:'dia',es:'apertura'};
  return h<14&&!existente(ap)?ap:{fe:hoy,tu:'dia',es:'cierre'};
}
function tabCierres(){
  const fila=d=>`<div class="den cero" data-d="${d}"><span class="dv">${dNom(d)}</span>
    <button type="button" class="pm" data-s="-1" aria-label="Uno menos de ${dNom(d)}">−</button>
    <button type="button" class="dn" aria-label="Cantidad de ${dNom(d)}: tocar para escribirla">0</button>
    <button type="button" class="pm" data-s="1" aria-label="Uno más de ${dNom(d)}">+</button>
    <span class="di">0,00 €</span></div>`;
  $('#panel').innerHTML=`<div class="cierre">
    <section class="caja" id="cf">
      <div class="cab"><h2>Arqueo de caja</h2><div class="fechanav"><span class="cual" id="fCual"></span>
        <button type="button" id="fAnt" aria-label="Día anterior">‹</button><input type="date" id="f_fecha" aria-label="Fecha del arqueo"><button type="button" id="fSig" aria-label="Día siguiente">›</button></div></div>
      <div class="filas"><div class="fila"><span class="et">Turno</span>
        <div class="seg" id="segTu">${Object.entries(TUR).map(([k,v])=>`<button type="button" data-tu="${k}">${v}</button>`).join('')}</div>
        <div class="seg" id="segEs">${Object.entries(EST).map(([k,v])=>`<button type="button" data-es="${k}">${v}</button>`).join('')}</div></div>
      <div class="fila"><span class="et">Quién</span><div class="chips" id="chips"></div></div></div>
      <div class="estado-form" id="estadoForm"></div>
      <h3>Billetes <button type="button" class="lnk" id="aCero">Poner todo en 0</button></h3><div class="dens b">${DENS.filter(d=>d>=5).map(fila).join('')}</div>
      <h3>Monedas</h3><div class="dens m">${DENS.filter(d=>d<5).map(fila).join('')}</div>
    </section>
    <aside class="resumen" id="resumen"></aside>
  </div>
  <div class="bar"><h2>Planilla</h2><span class="n" id="nC"></span></div><div id="lista"><div class="empty">Cargando…</div></div>`;
  sel=porDefecto();formSucio=false;
  const cf=$('#cf');
  cf.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    const den=b.closest('.den');
    if(den){const d=Number(den.dataset.d);if(b.classList.contains('pm'))ponerPz(d,(pz[d]||0)+Number(b.dataset.s));else abrirTeclado(d);return}
    if(b.dataset.tu)return cambiarSel({...sel,tu:b.dataset.tu});
    if(b.dataset.es)return cambiarSel({...sel,es:b.dataset.es});
    if(b.dataset.u!==undefined){quien=b.dataset.u;formSucio=true;pintarChips();return}
    if(b.id==='otro'){const n=(prompt('Nombre de quien hace el arqueo')||'').trim().slice(0,40);if(n.length<2)return;
      sumarUsuario(n);quien=USUARIOS.find(x=>sinTilde(x)===sinTilde(n));formSucio=true;pintarChips();return}
    if(b.id==='fAnt')return cambiarSel({...sel,fe:sumarDias(sel.fe,-1)});
    if(b.id==='fSig')return cambiarSel({...sel,fe:sumarDias(sel.fe,1)});
    if(b.id==='aCero'){if(!DENS.some(d=>pz[d])||!confirm('¿Poner todos los billetes y monedas en 0 para contar desde cero?'))return;
      pz={};formSucio=true;DENS.forEach(actDen);calcular()}
  });
  $('#f_fecha').onchange=e=>{const v=e.target.value, hoy=hoyISO();
    if(!v||v>hoy||(!esAdmin&&v<sumarDias(hoy,-2))){e.target.value=sel.fe;toast(v>hoy?'Todavía no llegó ese día':'Solo se pueden cargar los últimos 3 días');return}
    cambiarSel({...sel,fe:v})};
  llenar();
  cargarArqueos(true);
}
function cambiarSel(n){
  if(n.fe===sel.fe&&n.tu===sel.tu&&n.es===sel.es)return;
  if(n.fe>hoyISO()||(!esAdmin&&n.fe<sumarDias(hoyISO(),-2)))return;
  if(formSucio&&!confirm('Lo que cargaste todavía no está guardado. ¿Cambiar igual?')){pintarSel();return}
  sel=n;llenar();
}
function pintarSel(){
  const hoy=hoyISO(), fi=$('#f_fecha');if(!fi)return;
  fi.value=sel.fe;fi.max=hoy;if(esAdmin)fi.removeAttribute('min');else fi.min=sumarDias(hoy,-2);
  $('#fSig').disabled=sel.fe>=hoy;$('#fAnt').disabled=!esAdmin&&sel.fe<=sumarDias(hoy,-2);
  $('#fCual').textContent=(sel.fe===hoy?'Hoy · ':sel.fe===sumarDias(hoy,-1)?'Ayer · ':'')+nombreDia(sel.fe);
  document.querySelectorAll('#segTu button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tu===sel.tu));
  document.querySelectorAll('#segEs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.es===sel.es));
}
function pintarChips(){
  const c=$('#chips');if(!c)return;c.classList.remove('falta');
  c.innerHTML=USUARIOS.map(u=>`<button type="button" class="chip" data-u="${esc(u)}" style="--u:${colorU(u)}" aria-pressed="${u===quien}">${esc(u)}</button>`).join('')
    +'<button type="button" class="chip otro" id="otro">+ Otro</button>';
}
// Carga en pantalla el arqueo elegido: el guardado si ya existe; si no, lo que había en el anterior
function llenar(){
  const c=existente(sel), ant=anterior(sel), src=c||ant;
  pz={};
  if(src)DENS.forEach(d=>{const n=parseInt((src.piezas||{})[d],10);if(n>0)pz[d]=n});
  quien=c?c.usuario:'';sumarUsuario(quien);
  formSucio=false;pintarSel();pintarChips();DENS.forEach(actDen);
  $('#estadoForm').textContent=c?`Este arqueo ya está guardado (${c.usuario}, ${fHora(c.actualizado)}). Si cambiás algo y guardás, se corrige.`
    :!editable(sel.fe)?'Solo se pueden cargar o corregir los arqueos de los últimos 3 días.'
    :ant?`Arranca con lo que había en el ${descA(ant)}. Tocá solo lo que cambió.`:'';
  calcular();
}
function actDen(d){
  const el=document.querySelector(`.den[data-d="${d}"]`);if(!el)return;
  const n=pz[d]||0;el.classList.toggle('cero',!n);
  el.querySelector('.dn').textContent=n;el.querySelector('.di').textContent=eur(n*Math.round(d*100)/100);
}
function ponerPz(d,n){
  n=Math.max(0,Math.min(9999,Math.trunc(n)||0));if((pz[d]||0)===n)return;
  if(n)pz[d]=n;else delete pz[d];
  formSucio=true;actDen(d);calcular();
}
function calcular(){
  const r=$('#resumen');if(!r||!sel)return;
  const c=existente(sel), ant=anterior(sel), tot=totalPz(pz), bil=totalPz(pz,DENS.filter(d=>d>=5)), puede=editable(sel.fe);
  let v='';
  if(ant){const dif=Math.round((tot-ant.total)*100)/100, igual=Math.abs(dif)<0.005, ap=sel.es==='apertura';
    v=`<div class="veredicto ${igual?'ok':ap?'mal':'nada'}">${igual?'Igual que antes ✓':ap?(dif>0?'Sobran ':'Faltan ')+eur(Math.abs(dif)):eurS(dif)}
      <small>${igual?'Lo mismo que el ':ap?'Contra el ':'Respecto del '}${esc(descA(ant))}</small></div>`}
  r.innerHTML=`<div><div class="k">Total en caja</div><div class="tot">${eur(tot)}</div>
      <div class="partes">Billetes ${eur(bil)} · Monedas ${eur(Math.round((tot-bil)*100)/100)}</div></div>${v}
    <button type="button" class="btn ok" id="guardar" ${puede?'':'disabled'}>${c?'Guardar corrección':'Guardar '+EST[sel.es].toLowerCase()}</button>`;
  $('#guardar').onclick=guardarArqueo;
}
// Teclado propio: el primer número reemplaza lo que había; "Siguiente" pasa al billete o moneda que sigue
function cerrarTeclado(){
  const t=$('#tecl');if(t)t.remove();
  document.removeEventListener('keydown',abrirTeclado.tecla);
  document.querySelectorAll('.den.act').forEach(e=>e.classList.remove('act'));
}
function abrirTeclado(d){
  cerrarTeclado();
  let fresco=true;
  const sig=DENS[DENS.indexOf(d)+1], el=document.createElement('div');
  el.className='tecl';el.id='tecl';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',dQue(d));
  el.innerHTML=`<div class="box"><div class="tt">${dQue(d)} · ¿cuántos hay?</div>
    <div class="vis"><b id="tkN"></b><span id="tkI"></span></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join('')}
      <button type="button" data-k="c" aria-label="Poner en cero">C</button><button type="button" data-k="0">0</button><button type="button" data-k="b" aria-label="Borrar el último número">⌫</button></div>
    <div class="acts${sig===undefined?' solo':''}"><button type="button" class="btn sec" data-k="ok">Listo</button>${sig===undefined?'':`<button type="button" class="btn" data-k="sig">Siguiente: ${dNom(sig)}</button>`}</div></div>`;
  document.body.appendChild(el);
  const fila=document.querySelector(`.den[data-d="${d}"]`);if(fila)fila.classList.add('act');
  const ver=()=>{const n=pz[d]||0;$('#tkN').textContent=n;$('#tkI').textContent='= '+eur(n*Math.round(d*100)/100)};
  const tocar=k=>{
    if(k==='ok')return cerrarTeclado();
    if(k==='sig')return sig===undefined?cerrarTeclado():abrirTeclado(sig);
    const n=pz[d]||0;
    if(k==='c')ponerPz(d,0);else if(k==='b')ponerPz(d,Math.floor(n/10));
    else ponerPz(d,fresco?Number(k):n*10+Number(k)>9999?n:n*10+Number(k));
    fresco=false;ver();
  };
  el.addEventListener('click',e=>{if(e.target===el)return cerrarTeclado();const b=e.target.closest('[data-k]');if(b)tocar(b.dataset.k)});
  abrirTeclado.tecla=e=>{
    if(/^\d$/.test(e.key))tocar(e.key);else if(e.key==='Backspace')tocar('b');else if(e.key==='Escape')tocar('ok');
    else if(e.key==='Enter'||e.key==='Tab')tocar('sig');else return;
    e.preventDefault();
  };
  document.addEventListener('keydown',abrirTeclado.tecla);
  ver();
}
async function guardarArqueo(){
  if(!quien){toast('Tocá quién hace el arqueo');const c=$('#chips');c.classList.add('falta');c.scrollIntoView({block:'center',behavior:'smooth'});return}
  const c=existente(sel), tot=totalPz(pz);
  if(!tot&&!confirm('La caja está en 0,00 €. ¿Guardar igual?'))return;
  if(c&&!confirm(`Ya está guardado el ${descA(c)}. ¿Reemplazarlo con lo que cargaste ahora?`))return;
  $('#guardar').disabled=true;
  let r;try{r=await rpc('chequeos_guardar_arqueo',{p:{fecha:sel.fe,turno:sel.tu,estado:sel.es,usuario:quien,piezas:pz}})}
  catch(e){toast('No se guardó: '+e.message);$('#guardar').disabled=false;return}
  formSucio=false;
  toast(`${sel.es==='apertura'?'Apertura guardada':'Cierre guardado'} ✓ — ${eur(r.total)}`);
  await cargarArqueos(false);
}
async function cargarArqueos(primeraVez){
  let r;try{r=await rpc('chequeos_arqueos',{p_dias:esAdmin?400:60})}catch(e){
    const falta=/chequeos_arqueos|PGRST202|schema cache|does not exist/i.test((e.code||'')+' '+(e.message||''));
    if($('#lista'))$('#lista').innerHTML=`<div class="nf">${falta?'Falta correr el <b>chequeos.sql</b> nuevo en Supabase (SQL Editor → Run) para poder guardar los arqueos.':'No se pudo cargar: '+esc(e.message)}</div>`;
    return}
  ARQ=r.arqueos||[];
  (r.usuarios||[]).forEach(sumarUsuario);
  if(tab!=='cierres'||!$('#lista'))return;
  if(primeraVez){sel=porDefecto();llenar()}else if(!formSucio)llenar();else pintarChips();
  pintarPlanilla();
}
function pintarPlanilla(){
  $('#nC').textContent=ARQ.length?`${ARQ.length} ${ARQ.length===1?'arqueo':'arqueos'}${esAdmin?'':' · últimos 60 días'}`:'';
  if(!ARQ.length){$('#lista').innerHTML='<div class="empty">Todavía no hay arqueos cargados.</div>';return}
  const cols=DENS.filter(d=>ARQ.some(a=>(a.piezas||{})[d]>0));   // las columnas que nunca se usan no se muestran
  const imp=v=>v?Number(v).toLocaleString('es-ES',{maximumFractionDigits:2}):'<span class="z">0</span>';
  const dia=f=>{const t=new Date(f+'T12:00:00').toLocaleDateString('es-ES',{weekday:'short'}).replace('.','');return t.charAt(0).toUpperCase()+t.slice(1)+' '+fCorta(f)};
  let mes='', h='';
  ARQ.forEach((a,i)=>{
    if(a.fecha.slice(0,7)!==mes){mes=a.fecha.slice(0,7);
      h+=`<tr class="mes"><td colspan="${cols.length+7}">${new Date(a.fecha+'T12:00:00').toLocaleDateString('es-ES',{month:'long',year:'numeric'}).toUpperCase()}</td></tr>`}
    const prev=ARQ[i+1], dif=prev?Math.round((a.total-prev.total)*100)/100:null;
    h+=`<tr style="--u:${colorU(a.usuario)}"><td><b>${dia(a.fecha)}</b></td><td>${TUR[a.turno]}</td><td>${EST[a.estado]}</td><td><b>${esc(a.usuario)}</b></td>
      ${cols.map(d=>`<td class="num">${imp((a.piezas||{})[d]?a.piezas[d]*Math.round(d*100)/100:0)}</td>`).join('')}
      <td class="num"><b>${eur(a.total)}</b></td>
      <td class="num dif ${dif&&a.estado==='apertura'?(dif>0?'pos':'neg'):''}" title="Diferencia con el arqueo anterior">${dif===null?'':Math.abs(dif)<0.005?'=':eurS(dif)}</td>
      <td class="act"><button class="btn sec mini" data-e="${i}">${editable(a.fecha)?'Corregir':'Ver'}</button>${
        esAdmin?` <button class="tacho" data-x="${i}" title="Borrar arqueo" aria-label="Borrar el ${esc(descA(a))}">${TACHO}</button>`:''}</td></tr>`;
  });
  $('#lista').innerHTML=`<div class="tw"><table class="plan"><thead><tr><th>Fecha</th><th>Turno</th><th>Estado</th><th>Usuario</th>${
    cols.map(d=>`<th class="num">${dNom(d)}</th>`).join('')}<th class="num">Total</th><th class="num">Dif.</th><th></th></tr></thead><tbody>${h}</tbody></table></div>`;
  document.querySelectorAll('#lista [data-e]').forEach(b=>b.onclick=()=>{
    const a=ARQ[b.dataset.e];
    if(formSucio&&!confirm('Lo que cargaste todavía no está guardado. ¿Abrir este arqueo igual?'))return;
    sel={fe:a.fecha,tu:a.turno,es:a.estado};llenar();
    const fi=$('#f_fecha');fi.removeAttribute('min');fi.value=a.fecha;   // para mirar uno más viejo que los 3 días
    scrollTo({top:0,behavior:'smooth'});
  });
  document.querySelectorAll('#lista [data-x]').forEach(b=>b.onclick=async()=>{
    const a=ARQ[b.dataset.x];
    if(!confirm(`¿Borrar el ${descA(a)}? No se puede deshacer.`))return;
    try{await rpc('chequeos_borrar_arqueo',{p_id:a.id})}catch(e){toast('Error: '+e.message);return}
    toast('Arqueo borrado');cargarArqueos(false);
  });
}
addEventListener('beforeunload',e=>{if(tab==='cierres'&&formSucio){e.preventDefault();e.returnValue=''}});

entrar();
</script>
</body>
